<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/src/assets/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/src/assets/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/apple-touch-icon-180.png" />
    <title>echo</title>
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem("theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
          document.documentElement.dataset.mode = isDark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.mode = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
