name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      package-manager: bun
      runtime-version: "1.4.2"
      install-policy: blocked
      test-command: "cd packages/ip-service && bun run test:coverage"
      typecheck-command: "cd packages/ip-service && bun run typecheck"
      lint-command: "cd packages/ip-service && bun run lint"
      coverage-path: "packages/ip-service/coverage"
      osv-config: "osv-scanner.toml"
      l2: true
      l2-command: "cd packages/ip-service && bun run test:e2e && bun run test:builder"
