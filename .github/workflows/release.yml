name: Release
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
  schedule:
  - cron: 23 4 * * 1
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with successful CI at that tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-echo-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: packages/ip-service
    steps:
    - name: Resolve release source
      id: source
      uses: nocoo/base-ci/.github/actions/release-source@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
      with:
        github-token: ${{ github.token }}
        expected-workflow-path: .github/workflows/ci.yml
        expected-workflow-name: CI
        expected-branch: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        tag: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        package-version-match: 'true'
        package-json-path: packages/ip-service/package.json
        require-fresh-main: 'false'
        source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
        allowed-source-events: push,workflow_dispatch
    - name: Checkout proven SHA
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.source.outputs.target-sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Setup JS and frozen dependencies
      uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
      with:
        package-manager: bun
        runtime-version: 1.4.2
        node-version: 22.23.2
        working-directory: .
        install-policy: blocked
    - name: Fetch and verify IP databases
      run: bun run ipdb:fetch --verify
    - name: Run unit tests with coverage
      run: bun run test:coverage
    - name: Run typecheck
      run: bun run typecheck
    - name: Deploy to Vercel
      run: bunx vercel@59.16.0 deploy --prod --token="$VERCEL_TOKEN"
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    - name: Health check
      working-directory: .
      run: |
        set -euo pipefail
        expected=$(bun -e 'import { version } from "./packages/ip-service/src/lib/version.ts"; process.stdout.write(version)')
        for attempt in 1 2 3 4 5 6; do
          status=$(curl --silent --show-error --max-time 20 --output /tmp/echo-live.json --write-out '%{http_code}' https://echo.nocoo.cloud/api/live || true)
          if [ "$status" = 200 ] && jq -e --arg version "$expected" '.status == "ok" and .version == $version' /tmp/echo-live.json; then
            exit 0
          fi
          sleep 10
        done
        exit 1
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && startsWith(github.event.workflow_run.head_branch,
      'v'))
    timeout-minutes: 30
  weekly-bump:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ip-service
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup Bun without installing before release preflight
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - run: sudo apt-get install -y ripgrep
    - name: Configure git identity
      run: |
        git config user.name "nocoo"
        git config user.email "nocoo@hexly.ai"
    - run: bun run release -- patch --yes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HUSKY: '0'
    - name: Run tag CI for the scheduled release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="v$(jq -r .version package.json)"
        gh workflow run ci.yml --ref "$tag"
    timeout-minutes: 20
